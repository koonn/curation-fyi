name: deploy

on:
  push:
    branches: [main]
  # collect が GITHUB_TOKEN で push したコミットは push イベントを起こさない
  # （ワークフローの再帰を防ぐGitHubの仕様）。収集の完了自体を契機にする
  workflow_run:
    workflows: [collect]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# collect の自動コミットが連続しても、最後の1回だけデプロイすればよい
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # pagefind は devDependency なので --prod では入らない。既定のまま全部入れる
      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
