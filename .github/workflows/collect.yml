name: collect

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # シークレットは自動では環境変数にならないので明示的に渡す。
      # 未設定でも collect は成功する（LLM タグ付けだけがスキップされる）
      - run: pnpm collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # collect が非0で終わっても、保存済みの収集ぶんは必ずコミットする。
      # **付加工程（LLMのタグ付け・和訳）の失敗で収集データを落とさないため**——
      # 以前は collect の失敗でこのstepに到達せず、そのランの取得が丸ごと消えていた。
      # 収集そのものが落ちた場合は saveAll に到達しないので、ここは「変更なし」になる
      - name: Commit collected articles
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: collect articles ($(date -u +%Y-%m-%dT%H:%M))"
            git push
          fi
