# 追加を見送った候補（2026-08-22 実測）。再検討するときは同じURLを測り直すこと
#
# - Uber Engineering: 全パスが 406 / 404。2026-08-16 の診断（Cloudflare の bot 判定と推測）を再現。
#   https://www.uber.com/blog/engineering/rss/ → 406、https://eng.uber.com/feed/ → 404
# - Google Developers Blog (developers.googleblog.com/feeds/posts/default) と
#   blog.google/technology/developers/rss: **item に日付が1件も無い**（pubDate 0件）。
#   fetchers/rss.ts は published_at を作れない item を無言で捨てるため、登録しても収集0件になる
# - blogs.nvidia.com/feed/: GeForce NOW の週次告知・CEO受賞など広報記事が主体。技術記事は
#   developer.nvidia.com/blog 側にある
# - developer.apple.com/news/rss/news.rss: EU規制対応・利用規約更新・年齢レーティングなど
#   開発者向けの事務連絡が主体（142件）。Discord の Changelog と同じ理由で対象外
# - aws.amazon.com/blogs/aws/feed/: 製品告知と AWS Weekly Roundup が主体。技術記事は
#   architecture 側にある
# - security.googleblog.com / android-developers.googleblog.com: どちらも200で日付あり。
#   質は悪くないが1社1〜2本に留める方針で今回は入れていない
